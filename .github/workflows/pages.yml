name: pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'tools/site_build.py'
      - 'shared/assets/effects/**'
      - 'version.properties'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check whether Pages is configured
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/pages"
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  site = json.load(response)
              ready = site.get("build_type") == "workflow"
              reason = "Pages is configured for GitHub Actions." if ready else "Pages uses a different publishing source."
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              ready = False
              reason = "Pages is not enabled or is unavailable to this workflow (HTTP 404)."
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"deploy={str(ready).lower()}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Website\n{reason}\n")
              if not ready:
                  summary.write("Website generation still runs; publishing is skipped. To publish, select Settings > Pages > Source > GitHub Actions, then rerun this workflow. Android APKs are built separately by aevix-android.\n")
          if not ready:
              print(f"::notice::{reason} Skipping website deployment; APK builds use aevix-android.")
          PY
      - name: Build the website
        run: python3 tools/site_build.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/site

  deploy:
    needs: build
    if: ${{ needs.build.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
